global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "eduassist-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "eduassist-llmops"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
